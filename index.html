:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

.btn:not(:disabled):hover {

.form-control:disabled,

  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;

  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;jp-pop-sim&quot; aria-label=&quot;日本の人口ピラミッド・シミュレーター&quot;&gt;
  &lt;style&gt;
    #jp-pop-sim { color: var(--foreground); width: 100%; }
    #jp-pop-sim .sim-head { display: grid; grid-template-columns: repeat(4, minmax(0, max-content)); gap: 10px 28px; align-items: end; margin-bottom: 10px; }
    #jp-pop-sim .metric { display: grid; gap: 1px; }
    #jp-pop-sim .metric-label { color: var(--muted-foreground); font-size: 12px; }
    #jp-pop-sim .metric-value { font-size: clamp(20px, 4vw, 31px); font-weight: 500; font-variant-numeric: tabular-nums; }
    #jp-pop-sim .metric-unit { color: var(--muted-foreground); font-size: 12px; margin-left: 3px; }
    #jp-pop-sim .plot-title { margin: 5px 0 2px; font-weight: 500; text-align: center; }
    #jp-pop-sim .sex-labels { display: grid; grid-template-columns: 1fr 50px 1fr; color: var(--muted-foreground); font-size: 12px; text-align: center; margin-bottom: 2px; }
    #jp-pop-sim .chart-wrap { width: 100%; }
    #jp-pop-sim svg { width: 100%; display: block; overflow: visible; }
    #jp-pop-sim .frame { fill: none; stroke: var(--border); stroke-width: 1; }
    #jp-pop-sim .grid { stroke: var(--border); stroke-width: 1; }
    #jp-pop-sim .male { fill: var(--viz-series-1); opacity: .82; }
    #jp-pop-sim .female { fill: var(--viz-series-2); opacity: .82; }
    #jp-pop-sim .age, #jp-pop-sim .tick { fill: var(--foreground); font-size: 11px; }
    #jp-pop-sim .tick { fill: var(--muted-foreground); }
    #jp-pop-sim .controls { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 12px; display: grid; gap: 13px; }
    #jp-pop-sim .control-row { display: grid; grid-template-columns: 108px minmax(0, 1fr) 72px; gap: 12px; align-items: center; }
    #jp-pop-sim .control-name { font-weight: 500; }
    #jp-pop-sim .control-value { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
    #jp-pop-sim input[type=&quot;range&quot;] { width: 100%; accent-color: var(--primary); }
    #jp-pop-sim .scale-marks { grid-column: 2; position: relative; height: 15px; color: var(--muted-foreground); font-size: 11px; margin-top: -10px; pointer-events: none; }
    #jp-pop-sim .scale-marks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
    #jp-pop-sim .scale-marks span:first-child { transform: none; }
    #jp-pop-sim .scale-marks span:last-child { transform: translateX(-100%); }
    #jp-pop-sim .model-note { color: var(--muted-foreground); font-size: 11px; text-align: right; margin-top: 7px; }
    #jp-pop-sim .trend-action { display: flex; justify-content: center; margin-top: 4px; }
    #jp-pop-sim .trend-list { margin-top: 14px; }
    #jp-pop-sim .trend-item { display: grid; gap: 4px; }
    #jp-pop-sim .trend-title { font-weight: 500; text-align: center; }
    #jp-pop-sim .trend-chart { width: 100%; }
    #jp-pop-sim .trend-line { fill: none; stroke-width: 2.5; }
    #jp-pop-sim .trend-dot { stroke-width: 1; }
    #jp-pop-sim .trend-connector { fill: none; stroke-width: 1; }
    #jp-pop-sim .trend-end-label { fill: var(--foreground); font-size: 11px; }
    #jp-pop-sim .trend-axis-title { fill: var(--foreground); font-size: 12px; }
    #jp-pop-sim .disclosure { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 9px; }
    #jp-pop-sim .disclosure summary { cursor: pointer; font-weight: 500; }
    #jp-pop-sim .disclosure-body { margin-top: 9px; color: var(--muted-foreground); font-size: 12px; }
    #jp-pop-sim .disclosure-body p { margin: 0 0 7px; }
    #jp-pop-sim .disclosure-body ul { margin: 5px 0 9px; padding-left: 20px; }
    #jp-pop-sim .disclosure-body li { margin: 3px 0; }
    #jp-pop-sim .disclosure-body a { color: var(--foreground); }
    @media (max-width: 480px) {
      #jp-pop-sim .sim-head { grid-template-columns: repeat(2, minmax(0, max-content)); gap: 8px 16px; }
      #jp-pop-sim .control-row { grid-template-columns: 76px minmax(0, 1fr) 55px; gap: 8px; }
    }
  &lt;/style&gt;

  &lt;section class=&quot;sim-head&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;metric&quot;&gt;&lt;span class=&quot;metric-label&quot;&gt;年次&lt;/span&gt;&lt;span class=&quot;metric-value&quot; id=&quot;jps-year&quot;&gt;2025&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;metric&quot;&gt;&lt;span class=&quot;metric-label&quot;&gt;合計特殊出生率&lt;/span&gt;&lt;span class=&quot;metric-value&quot; id=&quot;jps-tfr&quot;&gt;1.20&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;metric&quot;&gt;&lt;span class=&quot;metric-label&quot;&gt;日本の総人口&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;metric-value&quot; id=&quot;jps-total&quot;&gt;1億2,305&lt;/span&gt;&lt;span class=&quot;metric-unit&quot;&gt;万人&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;metric&quot;&gt;&lt;span class=&quot;metric-label&quot;&gt;生産年齢人口（15～64歳）&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;metric-value&quot; id=&quot;jps-working&quot;&gt;7,000&lt;/span&gt;&lt;span class=&quot;metric-unit&quot;&gt;万人&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;plot-title&quot;&gt;男女・5歳階級別人口&lt;/div&gt;
  &lt;div class=&quot;sex-labels&quot;&gt;&lt;span&gt;男性&lt;/span&gt;&lt;span&gt;年齢&lt;/span&gt;&lt;span&gt;女性&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;chart-wrap&quot;&gt;&lt;svg id=&quot;jps-chart&quot; role=&quot;img&quot; aria-labelledby=&quot;jps-svg-title jps-svg-desc&quot;&gt;&lt;title id=&quot;jps-svg-title&quot;&gt;日本の人口ピラミッド&lt;/title&gt;&lt;desc id=&quot;jps-svg-desc&quot;&gt;左側が男性、右側が女性。年次と出生率のレバーで変化します。&lt;/desc&gt;&lt;/svg&gt;&lt;/div&gt;

  &lt;section class=&quot;controls&quot; aria-label=&quot;シミュレーション条件&quot;&gt;
    &lt;div class=&quot;control-row&quot;&gt;

  &lt;details class=&quot;disclosure&quot;&gt;
    &lt;summary&gt;注意事項・データソース・計算条件&lt;/summary&gt;
    &lt;div class=&quot;disclosure-body&quot;&gt;
      &lt;p&gt;&lt;strong&gt;注意事項：&lt;/strong&gt;本シミュレーターは、出生率の違いと人口構造の関係を学ぶための教育用の条件付き試算です。国立社会保障・人口問題研究所（社人研）が公表した将来人口そのものではなく、将来を予言するものでもありません。&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;データソース：&lt;/strong&gt;&lt;a href=&quot;https://www.ipss.go.jp/pp-zenkoku/j/zenkoku2023/pp_zenkoku2023.asp&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;社人研「日本の将来推計人口（令和5年推計）」&lt;/a&gt;の公表Excelを使用しています。&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;男女・5歳階級別人口：表1-9A、長期参考表1-9A&lt;/li&gt;
        &lt;li&gt;女性の年齢各歳別出生率：仮定値表2（出生中位）&lt;/li&gt;
        &lt;li&gt;男女・年齢別将来生命表：仮定値表7（死亡中位）&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;&lt;strong&gt;計算条件：&lt;/strong&gt;&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;2025年の男女・5歳階級別人口を出発人口とします。&lt;/li&gt;
        &lt;li&gt;選択した合計特殊出生率が2025年以降2100年まで一定であると仮定します。&lt;/li&gt;
        &lt;li&gt;出産年齢の分布は仮定値表2の2025年値に固定し、合計が選択出生率になるよう比例調整します。&lt;/li&gt;
        &lt;li&gt;生存率は死亡中位の将来生命表を使用し、2070年以降は2070年の値を固定します。&lt;/li&gt;
        &lt;li&gt;国際移動等は、公表人口と生命表から計算した生存人口との差を「移動・その他残差」として5年区間ごとに固定します。&lt;/li&gt;
        &lt;li&gt;100歳以上は、2025年以降に生まれた世代が2100年までに到達しないため、社人研の中位推計値を使用します。&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;データ取得・最終更新：2026年8月8日&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

    const tfrValues = Array.from({length:36},(_,i)=&gt;+(0.5+i*0.1).toFixed(1));
    const years = officialData.years;
    const ages = officialData.ages;

    function fertilityExposure(female) {
      return officialData.fertilityWeights2025.reduce((sum, weight, index) =&gt; sum + female[index + 3] * weight, 0);
    }

    function project(tfr, steps) {
      let m = officialData.population[2025].male.slice();
      let f = officialData.population[2025].female.slice();
      for (let step = 0; step &lt; steps; step++) {
        const year = years[step], next = years[step + 1];
        const baseline = officialData.population[year];
        const baselineNext = officialData.population[next];
        const exposureRatio = fertilityExposure(f) / fertilityExposure(baseline.female);
        const birthScale = (tfr / officialData.intervalTfr[year]) * exposureRatio;
        const nm = Array(21).fill(0), nf = Array(21).fill(0);

        // The published 0–4 population is the median-assumption anchor. It is
        // rescaled by the selected TFR and the scenario&#x27;s female exposure.
        nm[0] = baselineNext.male[0] * birthScale;
        nf[0] = baselineNext.female[0] * birthScale;

        // Official life-table survival by interval plus the migration residual
        // implied by IPSS Table 1-9A. This preserves calendar-year changes.
        for (let group = 1; group &lt; 20; group++) {
          nm[group] = Math.max(0, m[group - 1] * officialData.survival[year].male[group - 1] + officialData.migrationResidual[year].male[group - 1]);
          nf[group] = Math.max(0, f[group - 1] * officialData.survival[year].female[group - 1] + officialData.migrationResidual[year].female[group - 1]);
        }

        // No cohort born after 2025 reaches 100 by 2100; this group therefore
        // remains the official median projection without a fertility adjustment.
        nm[20] = baselineNext.male[20];
        nf[20] = baselineNext.female[20];
        m = nm; f = nf;
      }
      return {m,f};
    }

    function el(name, attrs={}) { const n=document.createElementNS(NS,name); Object.entries(attrs).forEach(([k,v])=&gt;n.setAttribute(k,v)); return n; }
    const trendSeries=[];
    let trendChart=null;
    function formatMan(value) {
      return Math.round(value * 100).toLocaleString(&#x27;ja-JP&#x27;);
    }

    function addTrend() {
      const tfr=tfrValues[+root.querySelector(&#x27;#jps-tfr-range&#x27;).value];
      const values=years.map((year,index)=&gt;{
        const data=project(tfr,index);
        return {year,total:data.m.reduce((a,b)=&gt;a+b,0)+data.f.reduce((a,b)=&gt;a+b,0)};
      });
      const existing=trendSeries.findIndex(series=&gt;series.tfr===tfr);
      if(existing&gt;=0) trendSeries[existing].values=values;
      else trendSeries.push({tfr,values});
      if(!trendChart) {
        const item=document.createElement(&#x27;article&#x27;);
        item.className=&#x27;trend-item&#x27;;
        const heading=document.createElement(&#x27;div&#x27;);
        heading.className=&#x27;trend-title&#x27;;
        heading.textContent=&#x27;出生率別・日本総人口の推移&#x27;;
        trendChart=el(&#x27;svg&#x27;,{class:&#x27;trend-chart&#x27;,role:&#x27;img&#x27;,&#x27;aria-label&#x27;:&#x27;出生率別の2025年から2100年までの日本総人口推移&#x27;});
        item.append(heading,trendChart);
        root.querySelector(&#x27;#jps-trend-list&#x27;).append(item);
      }
      drawTrend();
    }

    function drawTrend() {
      if(!trendChart || !trendSeries.length) return;
      const width=Math.max(320,trendChart.parentElement.clientWidth||736),height=Math.max(280,150+trendSeries.length*18);
      const narrow=width&lt;500;
      const margin={top:12,right:narrow?132:205,bottom:43,left:68};
      const innerW=width-margin.left-margin.right,innerH=height-margin.top-margin.bottom;
      const maxValue=Math.max(...trendSeries.flatMap(series=&gt;series.values.map(d=&gt;d.total)));
      const yMax=Math.ceil(maxValue/20)*20;
      const x=year=&gt;margin.left+(year-2025)/75*innerW;
      const y=value=&gt;margin.top+innerH-(value/yMax)*innerH;
      trendChart.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
      trendChart.replaceChildren();
      const title=el(&#x27;title&#x27;); title.textContent=&#x27;出生率別の日本総人口推移&#x27;; trendChart.append(title);
      const desc=el(&#x27;desc&#x27;); desc.textContent=`${trendSeries.length}つの出生率シナリオを比較`; trendChart.append(desc);
      trendChart.append(el(&#x27;rect&#x27;,{class:&#x27;frame&#x27;,&#x27;data-chart-frame&#x27;:&#x27;&#x27;,x:margin.left,y:margin.top,width:innerW,height:innerH}));
      [0,.25,.5,.75,1].forEach(p=&gt;{
        const value=yMax*p,yy=y(value);
        trendChart.append(el(&#x27;line&#x27;,{class:&#x27;grid&#x27;,x1:margin.left,y1:yy,x2:width-margin.right,y2:yy}));
        const label=el(&#x27;text&#x27;,{class:&#x27;tick&#x27;,&#x27;text-anchor&#x27;:&#x27;end&#x27;,x:margin.left-8,y:yy+4});
        label.textContent=Math.round(value*100).toLocaleString(&#x27;ja-JP&#x27;); trendChart.append(label);
      });
      [2025,2050,2075,2100].forEach(year=&gt;{
        const label=el(&#x27;text&#x27;,{class:&#x27;tick&#x27;,&#x27;text-anchor&#x27;:year===2025?&#x27;start&#x27;:year===2100?&#x27;end&#x27;:&#x27;middle&#x27;,x:x(year),y:height-22}); label.textContent=year; trendChart.append(label);
      });
      const xTitle=el(&#x27;text&#x27;,{class:&#x27;trend-axis-title&#x27;,&#x27;data-axis&#x27;:&#x27;x&#x27;,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,x:margin.left+innerW/2,y:height-4}); xTitle.textContent=&#x27;年次&#x27;; trendChart.append(xTitle);
      const yTitle=el(&#x27;text&#x27;,{class:&#x27;trend-axis-title&#x27;,&#x27;data-axis&#x27;:&#x27;y&#x27;,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,transform:`translate(14 ${margin.top+innerH/2}) rotate(-90)`}); yTitle.textContent=&#x27;総人口（万人）&#x27;; trendChart.append(yTitle);
      const endpoints=trendSeries.map((series,index)=&gt;({series,index,rawY:y(series.values.at(-1).total)})).sort((a,b)=&gt;a.rawY-b.rawY);
      const minGap=narrow?27:17;
      endpoints.forEach((point,index)=&gt;point.labelY=Math.max(point.rawY,index?endpoints[index-1].labelY+minGap:margin.top+8));
      const overflow=endpoints.at(-1).labelY-(margin.top+innerH-8);
      if(overflow&gt;0) endpoints.forEach(point=&gt;point.labelY-=overflow);
      endpoints.forEach((point,index)=&gt;{
        if(index&gt;0 &amp;&amp; point.labelY&lt;endpoints[index-1].labelY+minGap) point.labelY=endpoints[index-1].labelY+minGap;
      });
      trendSeries.forEach((series,index)=&gt;{
        const color=`var(--viz-series-${index%6+1})`;
        const line=el(&#x27;polyline&#x27;,{class:&#x27;trend-line&#x27;,points:series.values.map(d=&gt;`${x(d.year)},${y(d.total)}`).join(&#x27; &#x27;),style:`stroke:${color}`});
        trendChart.append(line);
        series.values.forEach(d=&gt;{
          const dot=el(&#x27;circle&#x27;,{class:&#x27;trend-dot&#x27;,cx:x(d.year),cy:y(d.total),r:3,style:`fill:${color};stroke:${color}`});
          dot.setAttribute(&#x27;data-tooltip&#x27;,`出生率${series.tfr.toFixed(1)} ${d.year}年 ${formatMan(d.total)}万人`);
          trendChart.append(dot);
        });
        const endpoint=endpoints.find(point=&gt;point.series===series);
        const labelX=x(2100)+10;
        trendChart.append(el(&#x27;path&#x27;,{class:&#x27;trend-connector&#x27;,d:`M${x(2100)},${endpoint.rawY} L${labelX-3},${endpoint.labelY}`,style:`stroke:${color}`}));
        const label=el(&#x27;text&#x27;,{class:&#x27;trend-end-label&#x27;,x:labelX,y:endpoint.labelY+(narrow?-6:4)});
        if(narrow) {
          const first=el(&#x27;tspan&#x27;,{x:labelX,dy:0}); first.textContent=`出生率${series.tfr.toFixed(1)}`;
          const second=el(&#x27;tspan&#x27;,{x:labelX,dy:13}); second.textContent=`2100年人口${formatMan(series.values.at(-1).total)}万人`;
          label.append(first,second);
        } else {
          label.textContent=`出生率${series.tfr.toFixed(1)}　2100年人口${formatMan(series.values.at(-1).total)}万人`;
        }
        trendChart.append(label);
      });
    }

    function draw() {
      const tIdx=+root.querySelector(&#x27;#jps-tfr-range&#x27;).value;
      const yIdx=+root.querySelector(&#x27;#jps-year-range&#x27;).value;
      const tfr=tfrValues[tIdx], year=years[yIdx], data=project(tfr,yIdx);
      const total=(data.m.reduce((a,b)=&gt;a+b,0)+data.f.reduce((a,b)=&gt;a+b,0))*100;
      const working=(data.m.slice(3,13).reduce((a,b)=&gt;a+b,0)+data.f.slice(3,13).reduce((a,b)=&gt;a+b,0))*100;
      root.querySelector(&#x27;#jps-year&#x27;).textContent=year;
      root.querySelector(&#x27;#jps-tfr&#x27;).textContent=tfr.toFixed(2);
      root.querySelector(&#x27;#jps-total&#x27;).textContent=(total&gt;=10000?`${Math.floor(total/10000)}億${Math.round(total%10000).toLocaleString(&#x27;ja-JP&#x27;)}`:Math.round(total).toLocaleString(&#x27;ja-JP&#x27;));
      root.querySelector(&#x27;#jps-working&#x27;).textContent=Math.round(working).toLocaleString(&#x27;ja-JP&#x27;);
      root.querySelector(&#x27;#jps-tfr-out&#x27;).textContent=tfr.toFixed(1);
      root.querySelector(&#x27;#jps-year-out&#x27;).textContent=`${year}年`;
      root.querySelector(&#x27;#jps-tfr-range&#x27;).setAttribute(&#x27;aria-valuetext&#x27;,tfr.toFixed(1));
      root.querySelector(&#x27;#jps-year-range&#x27;).setAttribute(&#x27;aria-valuetext&#x27;,`${year}年`);

      const width=Math.max(320,root.querySelector(&#x27;.chart-wrap&#x27;).clientWidth||736), height=450;
      const margin={top:13,right:27,bottom:28,left:27}, center=width/2, gap=46;
      const plotW=(width-margin.left-margin.right-gap)/2, rowH=(height-margin.top-margin.bottom)/ages.length;
      const max=Math.max(5.5,...data.m,...data.f), x=v=&gt;v/max*plotW;
      svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`); svg.replaceChildren();
      const title=el(&#x27;title&#x27;,{id:&#x27;jps-svg-title&#x27;}); title.textContent=`${year}年、出生率${tfr.toFixed(1)}の日本の人口ピラミッド`; svg.append(title);
      const desc=el(&#x27;desc&#x27;,{id:&#x27;jps-svg-desc&#x27;}); desc.textContent=`総人口は約${Math.round(total).toLocaleString(&#x27;ja-JP&#x27;)}万人。左が男性、右が女性。`; svg.append(desc);
      svg.append(el(&#x27;rect&#x27;,{class:&#x27;frame&#x27;,x:margin.left,y:margin.top,width:width-margin.left-margin.right,height:height-margin.top-margin.bottom}));
      [0,2,4].forEach(v=&gt;{
        const dx=x(v);
        if(v&gt;0){ svg.append(el(&#x27;line&#x27;,{class:&#x27;grid&#x27;,x1:center-gap/2-dx,y1:margin.top,x2:center-gap/2-dx,y2:height-margin.bottom})); svg.append(el(&#x27;line&#x27;,{class:&#x27;grid&#x27;,x1:center+gap/2+dx,y1:margin.top,x2:center+gap/2+dx,y2:height-margin.bottom})); }
        if(v&gt;0){
          const label=`${v*100}万人`;
          const l=el(&#x27;text&#x27;,{class:&#x27;tick&#x27;,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,x:center-gap/2-dx,y:height-9}); l.textContent=label; svg.append(l);
          const r=el(&#x27;text&#x27;,{class:&#x27;tick&#x27;,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,x:center+gap/2+dx,y:height-9}); r.textContent=label; svg.append(r);
        }
      });

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

      .then(({ x, y }) =&gt; {

  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);

    }

    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||

    }

    const delay =
